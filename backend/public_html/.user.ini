; Scheme Staff API — PHP overrides for this directory.
;
; PHP adds an X-PHP-Originating-Script header to every message sent with mail(),
; naming the script that sent it. Spam filters treat that as a strong signal,
; since legitimate transactional mail rarely advertises that it came from a
; web form. Turning it off removes one reason for a message to be scored as junk.
;
; .user.ini is read by PHP-FPM/CGI and cached for a few minutes, so a change here
; can take up to five minutes to take effect.

mail.add_x_header = 0
